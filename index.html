<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDE | Estudio de Arquitectura & Diseño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-dark: #1C211A;
            --color-brown: #5E4638;
            --color-sage: #7C8068;
            --color-beige: #E5E0D8;
            --color-light: #F8F7F5;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--color-light); 
            color: var(--color-dark);
            overflow-x: hidden;
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 25px; 
        }

        /* HEADER */
        header { 
            padding: 35px 0 25px 0; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        
        .logo-box { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: inherit; 
        }
        
        .logo-main { 
            font-size: 46px; 
            font-weight: 800; 
            line-height: 0.8; 
            letter-spacing: -1.5px; 
            text-transform: lowercase; 
            margin-right: 18px; 
        }
        
        .logo-divider { 
            width: 1.5px; 
            height: 52px; 
            background-color: var(--color-dark); 
            margin-right: 18px; 
        }
        
        .logo-text { 
            font-size: 14px; 
            font-weight: 400; 
            line-height: 1.25; 
            letter-spacing: 1px; 
            text-transform: lowercase; 
        }
        
        .slogan { 
            font-size: 17px; 
            font-weight: 500; 
            max-width: 520px; 
            text-align: right; 
            line-height: 1.4; 
        }

        /* HERO SECCIÓN */
        .hero-section { 
            margin-bottom: 40px; 
        }
        
        .hero-slider-container { 
            width: 100%; 
            height: 52vh; 
            min-height: 400px; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.06); 
            position: relative; 
            cursor: none; 
        }
        
        .hero-slider-wrapper { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        }
        
        .hero-slider-wrapper img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .after-image { 
            z-index: 1; 
        }
        
        .before-image { 
            z-index: 2; 
            opacity: 1; 
            transition: opacity 0.7s ease-in-out; 
        }

        .hero-slider-container:hover .before-image { 
            opacity: 0; 
        }

        .slider-label { 
            position: absolute; 
            top: 20px; 
            background-color: rgba(28, 33, 26, 0.75); 
            color: var(--color-light); 
            padding: 8px 16px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 600; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            z-index: 3; 
            pointer-events: none; 
        }
        
        .label-before { left: 20px; }
        .label-after { right: 20px; }

        /* PUNTERO PERSONALIZADO FLOTANTE (Solo PC) */
        .custom-cursor {
            position: fixed;
            z-index: 99;
            background-color: rgba(248, 247, 245, 0.95); 
            color: var(--color-dark);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            pointer-events: none; 
            opacity: 0; 
            transform: translate(-50%, -50%); 
            transition: opacity 0.3s ease;
            white-space: nowrap; 
        }

        /* CATEGORÍAS */
        .nav-categories { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            padding: 10px 0 45px 0; 
        }
        
        .category-circle { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            background-color: var(--color-brown); 
            color: var(--color-light); 
            text-decoration: none; 
            text-align: center; 
            padding: 15px; 
            transition: all 0.4s ease; 
            box-shadow: 0 4px 15px rgba(94, 70, 56, 0.15); 
        }
        
        .category-circle span { 
            font-size: 11px; 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            line-height: 1.3; 
        }
        
        .category-circle:hover { 
            transform: translateY(-8px); 
            background-color: var(--color-sage); 
            box-shadow: 0 12px 24px rgba(124, 128, 104, 0.3); 
        }

        /* ===================================================
           NUEVA SECCIÓN RESPONSIVE: OPTIMIZACIÓN PARA CELULARES
           =================================================== */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            header { 
                flex-direction: column; 
                text-align: center; 
                gap: 15px; 
                padding: 25px 0 20px 0;
            }

            .logo-main {
                font-size: 38px;
                margin-right: 12px;
            }

            .logo-divider {
                height: 42px;
                margin-right: 12px;
            }

            .logo-text {
                font-size: 12px;
                text-align: left;
            }

            .slogan { 
                text-align: center; 
                font-size: 14px; 
                max-width: 100%;
                line-height: 1.5;
            }

            .hero-section {
                margin-bottom: 25px;
            }

            /* Corregimos la proporción del slider en móviles verticales */
            .hero-slider-container {
                height: 260px; 
                min-height: 260px;
                cursor: pointer; /* Restauramos cursor normal en teléfonos */
            }

            .slider-label {
                top: 12px;
                padding: 5px 10px;
                font-size: 9px;
                letter-spacing: 1px;
            }
            .label-before { left: 12px; }
            .label-after { right: 12px; }

            /* Reacomodamos los botones circulares en una cuadrícula cómoda */
            .nav-categories { 
                justify-content: center; 
                gap: 15px; 
                padding: 5px 0 30px 0;
            }

            .category-circle {
                width: 105px;
                height: 105px;
                padding: 8px;
            }

            .category-circle span {
                font-size: 8.5px;
                letter-spacing: 1px;
            }
        }

        /* FOOTER */
        footer { 
            background-color: var(--color-dark); 
            color: var(--color-light); 
            padding: 25px 0; 
            text-align: center; 
            font-size: 12px; 
        }
    </style>
</head>
<body>

    <div id="customCursor" class="custom-cursor">Lo viejo por lo nuevo</div>

    <div class="container">
        <header>
            <a href="index.html" class="logo-box">
                <div class="logo-main">re<br>de</div>
                <div class="logo-divider"></div>
                <div class="logo-text">estudio<br>arquitectura<br>& diseño</div>
            </a>
            <div class="slogan">
                "Rediseñamos tu entorno para que tu casa sea, finalmente, tu lugar en el mundo."
            </div>
        </header>

        <section class="hero-section">
            <div id="sliderContainer" class="hero-slider-container">
                <div class="hero-slider-wrapper">
                    <img src="despues.jpg" class="after-image" alt="REDE Living Remodelado">
                    <img src="antes.jpg" class="before-image" alt="Living Viejo">
                    
                    <div class="slider-label label-before">ANTES</div>
                    <div class="slider-label label-after">DESPUÉS</div>
                </div>
            </div>
        </section>

        <nav class="nav-categories">
            <a href="banos.html" class="category-circle"><span>REDE<br>BAÑOS</span></a>
            <a href="cocina.html" class="category-circle"><span>REDE<br>COCINA</span></a>
            <a href="living.html" class="category-circle"><span>REDE<br>LIVING</span></a>
            <a href="habitacion.html" class="category-circle"><span>REDE<br>HABITACION</span></a>
            <a href="patios.html" class="category-circle"><span>REDE<br>PATIOS</span></a>
        </nav>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 REDE Estudio. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('sliderContainer');
            const cursor = document.getElementById('customCursor');

            // Verificamos si el dispositivo soporta puntero (computadora) para evitar tildes en móviles
            const isDesktop = window.matchMedia("(pointer: fine)").matches;

            if (isDesktop) {
                container.addEventListener('mouseenter', () => {
                    cursor.style.opacity = '1';
                });

                container.addEventListener('mouseleave', () => {
                    cursor.style.opacity = '0';
                });

                container.addEventListener('mousemove', (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                });
            } else {
                // En móviles y tablets, permitimos el cambio con un simple toque (tap) en la pantalla
                container.addEventListener('click', function() {
                    const beforeImg = this.querySelector('.before-image');
                    // Alterna la opacidad de la imagen vieja en cada toque táctil
                    if (beforeImg.style.opacity === '0') {
                        beforeImg.style.opacity = '1';
                    } else {
                        beforeImg.style.opacity = '0';
                    }
                });
            }
        });
    </script>

</body>
</html>
